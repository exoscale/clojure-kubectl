name: Clojure CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '25'
        java-package: jdk
        architecture: x64
    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        lein: latest
    - name: Run tests
      run: lein test
